name: Build & Release

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev libudev-dev libblkid-dev

      - name: Build
        run: make -j"$(nproc)"

      - name: Smoke test
        run: |
          ./sectrc --version
          ./sectrc --help

  release:
    # Only release from pushes to master. Put "[no release]" in a commit
    # message to push without creating a new version.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && !contains(github.event.head_commit.message, '[no release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out next version
        id: version
        run: |
          next=$(./scripts/next-version.sh)
          current=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          echo "version=$next" >> "$GITHUB_OUTPUT"
          if [ "$next" = "$current" ]; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
          echo "Current: ${current:-none}  Next: $next"

      - name: Install dependencies
        if: steps.version.outputs.new == 'true'
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev libudev-dev libblkid-dev

      - name: Tag
        if: steps.version.outputs.new == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Build release binary
        if: steps.version.outputs.new == 'true'
        run: |
          make -j"$(nproc)"
          ./sectrc --version
          tar -czf "sectrc-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz" sectrc README.md LICENSE

      - name: Create GitHub release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            "sectrc-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz" \
            --title "SectrC ${{ steps.version.outputs.version }}" \
            --generate-notes
